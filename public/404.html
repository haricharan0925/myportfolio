<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found | Hari Charan</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07090a; color: #f4f4f5;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 24px;
        background-image: radial-gradient(circle at 50% 120%, rgba(16,185,129,.22), transparent 55%); }
      .code { font-size: clamp(5rem, 18vw, 9rem); font-weight: 800; letter-spacing: -.06em; line-height: 1;
        background: linear-gradient(100deg, #10b981, #2dd4bf); -webkit-background-clip: text; background-clip: text; color: transparent; }
      h1 { margin: 16px 0 8px; font-size: 1.6rem; }
      p { margin: 0 0 28px; color: #a1a1aa; }
      a { display: inline-block; padding: 14px 24px; border-radius: 12px; background: #10b981; color: #03140e; font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 2px solid #2dd4bf; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="code" aria-hidden="true">404</div>
      <h1>Page not found</h1>
      <p>The page you are looking for does not exist or has moved.</p>
      <a href="/">Back to home</a>
    </main>
  </body>
</html>
